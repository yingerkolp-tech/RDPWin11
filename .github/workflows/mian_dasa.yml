name: dasa asd

on:
  workflow_dispatch:

jobs:
  secure-mac-session:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Install & Configure Tailscale
        run: |
          brew install tailscale
          
          # Start Tailscale background daemon directly
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale using the secret auth key
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-macos-$GITHUB_RUN_ID
          
          # Poll until Tailscale assigns a 100.x.y.z IP address
          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
              tsIP=$(tailscale ip -4)
              if [ -z "$tsIP" ]; then
                  sleep 5
                  retries=$((retries + 1))
              fi
          done
          
          if [ -z "$tsIP" ]; then
              echo "::error::Tailscale IP not assigned. Exiting."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

      - name: Launch Interactive Terminal (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Verify Network Connectivity
        run: |
          echo "Checking connectivity on Tailscale IP: $TAILSCALE_IP"
          ping -c 3 $TAILSCALE_IP || echo "Ping completed."

      - name: Maintain Connection & Show Access Details
        run: |
          echo ""
          echo "=================================================="
          echo "=== MACOS TAILSCALE SESSION READY ==="
          echo "Tailscale IP: $TAILSCALE_IP"
          echo "OS Version:   $(sw_vers -productVersion)"
          echo "Runner User:  runner"
          echo "=================================================="
          echo ""
          echo "Check the 'Launch Interactive Terminal (tmate)' step"
          echo "logs above for your instant Web URL and SSH access links."
          echo "=================================================="
          echo ""
          
          # Keep workflow alive
          while true; do
              echo "[$(date)] Session active..."
              sleep 300
          done
