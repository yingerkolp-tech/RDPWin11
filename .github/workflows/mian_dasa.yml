name: dasa asd

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Headless Display & VNC
        run: |
          # 1. Set VNC Password
          VNC_PW="12345678"
          
          # 2. Update runner system password (pass existing 'runner' password)
          sudo dscl . -passwd /Users/runner runner "$VNC_PW" 2>/dev/null || echo "runner:$VNC_PW" | sudo chpasswd 2>/dev/null || true
          
          # 3. Write VNC configuration directly to macOS defaults database
          sudo defaults write /Library/Preferences/com.apple.VNCSettings.plist Password -string "$VNC_PW"
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true

          # 4. Enable legacy VNC password authentication cleanly (fixed kickstart syntax)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy yes -setvncpw -vncpw "$VNC_PW"
            
          # 5. Activate ARD and grant privileges
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all

          # Save credentials to env
          echo "VNC_USER=runner" >> $GITHUB_ENV
          echo "VNC_PASS=$VNC_PW" >> $GITHUB_ENV

      - name: Install & Start Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-macos-$GITHUB_RUN_ID
          
          tsIP=""
          retries=0
          while [ -z "$tsIP" ] && [ $retries -lt 10 ]; do
              tsIP=$(tailscale ip -4)
              if [ -z "$tsIP" ]; then
                  sleep 5
                  retries=$((retries + 1))
              fi
          done
          
          if [ -z "$tsIP" ]; then
              echo "::error::Tailscale IP not assigned. Exiting."
              exit 1
          fi
          echo "TAILSCALE_IP=$tsIP" >> $GITHUB_ENV

      - name: Maintain Connection
        run: |
          echo ""
          echo "========================================"
          echo "=== VNC ACCESS READY ==="
          echo "Address:  $TAILSCALE_IP:5900"
          echo "Username: runner"
          echo "Password: $VNC_PASS"
          echo "========================================"
          echo ""
          
          while true; do
              echo "[$(date)] VNC Active"
              sleep 300
          done
